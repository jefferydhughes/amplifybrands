<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111111" />
  <title>Amplify Brands — Choose a Version</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Mono:wght@500&family=Manrope:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#111111; --paper:#F5F1E8; --acid:#E8FF32; --red:#D72D27; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--ink); color:var(--paper); font:500 16px/1.55 Manrope, Arial, sans-serif; display:flex; flex-direction:column; }
    .wrap { width:min(1100px, calc(100% - 40px)); margin:auto; padding:64px 0; }
    .brand { font:800 30px/1 "Barlow Condensed", Impact, sans-serif; letter-spacing:.01em; }
    .brand b { color:var(--acid); }
    .kicker { margin:40px 0 14px; font:500 12px "DM Mono", monospace; letter-spacing:.09em; text-transform:uppercase; color:#cfcbc2; }
    h1 { margin:0; font:800 clamp(44px, 7vw, 88px)/.98 "Barlow Condensed", Impact, sans-serif; letter-spacing:.01em; text-transform:uppercase; }
    .options { margin-top:48px; display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:24px; }
    a.option { display:flex; flex-direction:column; gap:14px; padding:34px; min-height:240px; text-decoration:none; color:var(--ink); background:var(--paper); border:2px solid var(--paper); transition:transform .18s ease, box-shadow .18s ease; }
    a.option:hover, a.option:focus-visible { transform:translate(-4px,-4px); box-shadow:8px 8px 0 var(--acid); outline:none; }
    a.option.b { background:var(--acid); border-color:var(--acid); }
    a.option.b:hover, a.option.b:focus-visible { box-shadow:8px 8px 0 var(--red); }
    .tag { font:500 12px "DM Mono", monospace; letter-spacing:.08em; text-transform:uppercase; }
    .name { font:800 64px/.95 "Barlow Condensed", Impact, sans-serif; text-transform:uppercase; letter-spacing:.01em; }
    .go { margin-top:auto; font-weight:700; text-transform:uppercase; letter-spacing:.04em; font-size:13px; }
    .legacy { margin-top:32px; font:500 12px "DM Mono", monospace; color:#a9a69e; }
    .legacy a { color:var(--acid); }
  </style>
  <!-- Vercel Web Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <main class="wrap">
    <div class="brand">AMPLIFY<b>.</b></div>
    <p class="kicker">Homepage A/B test</p>
    <h1>Pick a version.</h1>
    <div class="options">
      <a class="option" href="/option-a">
        <span class="tag">Option A</span>
        <span class="name">Version A</span>
        <span class="go">Open option A ↗</span>
      </a>
      <a class="option b" href="/option-b">
        <span class="tag">Option B</span>
        <span class="name">Version B</span>
        <span class="go">Open option B ↗</span>
      </a>
    </div>
    <p class="legacy">Previous homepage: <a href="/index-legacy">/index-legacy</a></p>
  </main>
</body>
</html>
